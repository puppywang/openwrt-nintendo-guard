name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve build version
        id: metadata
        env:
          BUILD_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py version --tag "$BUILD_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check luci/nintendo.js
      - run: node tests/luci.test.js
      - run: |
          for script in install.sh uninstall.sh packaging/lifecycle.sh scripts/build_apk_host.sh luci/nintendo-control.init luci/nintendo-control.rpc luci/nintendo-control-firewall; do
            sh -n "$script"
          done
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables conntrack iproute2 openssl meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev busybox-static fakeroot
      - run: go build -o build/nintendo-guard ./cmd/nintendo-guard
      - name: Network namespace integration
        run: sudo timeout 90 unshare --net python3 tests/network_integration.py build/nintendo-guard
      - name: Build release bundles
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 scripts/build.py --version "$BUILD_VERSION"
      - name: Build native APK and IPK packages
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          sh scripts/build_apk_host.sh
          fakeroot python3 scripts/build_native.py --version "$BUILD_VERSION" --apk build/apk-tools/out/src/apk
      - name: Native package installation, upgrade and removal tests
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: sudo python3 tests/native_packages.py --version "$BUILD_VERSION" --apk build/apk-tools/out/src/apk
      - name: Verify complete release manifest
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
        run: python3 scripts/release.py check --tag "$BUILD_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundles
          path: dist
      - name: Publish verified preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG"
